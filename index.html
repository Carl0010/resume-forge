<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var t = localStorage.getItem('resumeforge-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <title>ResumeForge</title>
    <meta name="description" content="Build a professional resume or CV for free. 50 templates, live preview, no login, no hidden charges." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&family=Merriweather:wght@400;700&family=EB+Garamond:wght@400;500;700&family=Lora:wght@400;600;700&family=Playfair+Display:wght@500;700&family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@400;500;600;700&family=Raleway:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Crimson+Pro:wght@400;600;700&family=Nunito+Sans:wght@400;600;700&family=Work+Sans:wght@400;500;600;700&family=PT+Serif:wght@400;700&display=swap" />

  </body>
</html>
